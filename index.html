<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Music Station</title>
  
  <!-- Inline SVG Music Note Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23131021'/><text y='.75em' x='50%' text-anchor='middle' font-size='70' fill='%23F57D7C'>%E2%99%AC</text></svg>">

  <!-- Retro Pixel Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone (Cloudflare CDNjs + unpkg fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>

  <style>
    /* STYLING CONSTRAINTS: ZERO border-radius anywhere, pure pixel art */
    *, *::before, *::after {
      border-radius: 0 !important;
      image-rendering: pixelated;
      box-sizing: border-box;
    }

    body {
      background-color: #131021;
      color: #FFF;
      font-family: 'VT323', monospace;
      overflow-x: hidden;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    /* Core 65:35 Responsive Grid & Flex Layouts */
    .app-wrapper {
      max-width: 1650px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-workspace {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      width: 100%;
      flex: 1;
    }

    @media (min-width: 900px) {
      .main-workspace {
        flex-direction: row;
        align-items: stretch;
      }
      .panel-left-container {
        width: 65%;
        flex: 0 0 65%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .panel-right-container {
        width: 35%;
        flex: 0 0 35%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
    }

    @media (max-width: 899px) {
      .panel-left-container, .panel-right-container {
        width: 100%;
        min-width: 0;
      }
    }

    /* Pixel Art Borders & Shadows */
    .pixel-frame {
      border: 3px solid #3D2F4C;
      box-shadow: 4px 4px 0px #000;
      background-color: rgba(29, 23, 40, 0.90);
    }

    .pixel-frame-inset {
      border: 3px solid #3D2F4C;
      box-shadow: inset 3px 3px 0px #131021, inset -3px -3px 0px #3D2F4C;
      background-color: rgba(19, 16, 33, 0.96);
    }

    .pixel-frame-arcade {
      border: 4px solid #F57D7C;
      box-shadow: 8px 8px 0px #000;
      background-color: rgba(19, 16, 33, 0.98);
    }

    /* Unified Button System */
    .pixel-btn, .btn-unclicked {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #3D2F4C;
      box-shadow: 4px 4px 0px #000;
      background-color: #2A2238;
      color: #FFFFFF;
      cursor: pointer;
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      text-align: center;
      transition: transform 0.05s steps(1), box-shadow 0.05s steps(1), background-color 0.05s steps(1);
    }

    .pixel-btn:hover, .btn-unclicked:hover {
      background-color: #3D2F4C;
      color: #FFC061;
      border-color: #5B3256;
    }

    .pixel-btn:active, .btn-unclicked:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .pixel-btn:disabled, .btn-unclicked:disabled {
      opacity: 0.40;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 4px 4px 0px #000 !important;
      background-color: #2A2238 !important;
      color: #777 !important;
      border-color: #3D2F4C !important;
    }

    .btn-clicked {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #FFC061;
      box-shadow: 4px 4px 0px #000;
      background-color: #F57D7C;
      color: #131021;
      cursor: pointer;
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      text-align: center;
      transition: transform 0.05s steps(1), box-shadow 0.05s steps(1), background-color 0.05s steps(1);
    }

    .btn-clicked:hover {
      background-color: #FFA5A4;
      color: #131021;
      border-color: #FFE0A3;
    }

    .btn-clicked:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .pixel-btn-danger {
      background-color: #A2536A;
      color: #FFF;
      border-color: #F57D7C;
    }
    .pixel-btn-danger:hover {
      background-color: #C46781;
      color: #FFF;
    }

    /* Standardized Group Sizes */
    .btn-header {
      height: 38px;
      min-width: 110px;
      font-size: 1.15rem;
    }

    .btn-tab {
      height: 44px;
      flex: 1;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .btn-primary-transport {
      height: 46px;
      font-size: 1.3rem;
    }
    .btn-transport-prev-next {
      height: 46px;
      width: 58px;
      font-size: 1.3rem;
    }
    .btn-transport-play {
      height: 46px;
      min-width: 100px;
      font-size: 1.3rem;
    }

    .btn-mode-group {
      height: 40px;
      min-width: 95px;
      font-size: 1.15rem;
    }

    .btn-speed {
      height: 32px;
      width: 54px;
      font-size: 1.05rem;
    }

    .btn-form-action {
      height: 44px;
      min-width: 110px;
      font-size: 1.2rem;
    }

    /* Inputs */
    .pixel-input {
      border: 3px solid #3D2F4C;
      background-color: #131021;
      color: #FFC061;
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      padding: 6px 12px;
      box-shadow: inset 3px 3px 0px #000;
      outline: none;
      width: 100%;
    }
    .pixel-input:focus {
      border-color: #F57D7C;
    }

    /* Custom Retro Pixel Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: #131021;
      border-left: 2px solid #3D2F4C;
    }
    ::-webkit-scrollbar-thumb {
      background: #3D2F4C;
      border: 2px solid #5B3256;
      box-shadow: 2px 2px 0px #000;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #E08573;
    }

    /* Step-based retro animations */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 16s linear infinite;
    }

    @keyframes pulseStep {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.02); }
    }
    .pulse-pixel {
      animation: pulseStep 1.2s steps(4) infinite;
    }

    @keyframes starBlink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .star-1 { animation: starBlink 1.8s steps(3) infinite; }
    .star-2 { animation: starBlink 2.4s steps(4) infinite 0.6s; }
    .star-3 { animation: starBlink 3.1s steps(3) infinite 1.2s; }
  </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between overflow-x-hidden selection:bg-[#F57D7C] selection:text-[#131021]">

  <!-- Background Dusk Cityscape SVG Layer (Minimalist 16/32-Bit Pixel Art) -->
  <div id="cityscape-bg" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- React Root Container -->
  <div id="root" class="relative z-10 min-h-screen flex flex-col"></div>

  <!-- Main Application Script (Babel Standalone JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Safe LocalStorage helpers
    function safeGet(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, val);
      } catch (e) {}
    }

    // SFX Sound Generator (8-bit Web Audio Synthesizer)
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTone(freq, type, duration, vol = 0.08) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      click() { this.playTone(880, 'square', 0.04, 0.03); }
      coin() {
        this.playTone(987.77, 'square', 0.06, 0.04);
        setTimeout(() => this.playTone(1318.51, 'square', 0.14, 0.04), 60);
      }
      delete() { this.playTone(220, 'sawtooth', 0.08, 0.04); }
      switch() { this.playTone(523.25, 'triangle', 0.05, 0.04); }
      open() {
        this.playTone(440, 'square', 0.05, 0.04);
        setTimeout(() => this.playTone(659.25, 'square', 0.08, 0.04), 50);
      }
    }
    const sfx = new SoundFX();

    // Helper: Parse YouTube URL into Video ID
    function extractVideoId(url) {
      if (!url) return null;
      const clean = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
      
      const patterns = [
        /(?:youtube\.com\/watch\?v=)([^#\&\?]{11})/,
        /(?:youtu\.be\/)([^#\&\?]{11})/,
        /(?:youtube\.com\/embed\/)([^#\&\?]{11})/,
        /(?:youtube\.com\/shorts\/)([^#\&\?]{11})/,
        /(?:music\.youtube\.com\/watch\?v=)([^#\&\?]{11})/
      ];
      
      for (const p of patterns) {
        const match = clean.match(p);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    // Helper: Fetch Video Title via noembed oEmbed proxy
    async function fetchVideoTitle(videoId) {
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.title) return data.title;
        }
      } catch (err) {}
      return `YouTube Video [${videoId}]`;
    }

    // Helper: Format Seconds to MM:SS
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // --- MAIN PARENT COMPONENT ---
    function App() {
      const [queue, setQueue] = useState(() => {
        const saved = safeGet('jms_queue_v13', null);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [];
      });

      const [currentTrack, setCurrentTrack] = useState(() => {
        const saved = safeGet('jms_current_v13', null);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return null;
      });

      const [history, setHistory] = useState(() => {
        const saved = safeGet('jms_history_v13', null);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [];
      });

      const [isPlaying, setIsPlaying] = useState(false);
      const [playerStatus, setPlayerStatus] = useState('empty'); // "playing" | "paused" | "empty"
      
      // Default volume: 25%
      const [volume, setVolume] = useState(() => {
        const saved = safeGet('jms_volume_v13', null);
        return saved !== null ? Number(saved) : 25;
      });

      // Additional UI State
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [loopMode, setLoopMode] = useState('none'); // 'none' | 'one' | 'all'
      const [playbackRate, setPlaybackRate] = useState(1);
      const [ccEnabled, setCcEnabled] = useState(false);
      const [activeTab, setActiveTab] = useState('queue'); // 'queue' | 'history'
      const [toastMsg, setToastMsg] = useState(null);

      // Search Arcade Modal State
      const [isSearchOpen, setIsSearchOpen] = useState(false);

      // Refs to prevent stale closures in YouTube Player event callbacks
      const queueRef = useRef(queue);
      const currentTrackRef = useRef(currentTrack);
      const historyRef = useRef(history);
      const loopModeRef = useRef(loopMode);
      const isPlayingRef = useRef(isPlaying);
      const playerRef = useRef(null);
      const isPlayerReady = useRef(false);
      const timerRef = useRef(null);

      useEffect(() => { queueRef.current = queue; }, [queue]);
      useEffect(() => { currentTrackRef.current = currentTrack; }, [currentTrack]);
      useEffect(() => { historyRef.current = history; }, [history]);
      useEffect(() => { loopModeRef.current = loopMode; }, [loopMode]);
      useEffect(() => { isPlayingRef.current = isPlaying; }, [isPlaying]);

      // Persist state
      useEffect(() => { safeSet('jms_queue_v13', JSON.stringify(queue)); }, [queue]);
      useEffect(() => { safeSet('jms_current_v13', JSON.stringify(currentTrack)); }, [currentTrack]);
      useEffect(() => { safeSet('jms_history_v13', JSON.stringify(history)); }, [history]);
      useEffect(() => { safeSet('jms_volume_v13', volume.toString()); }, [volume]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Keyboard Shortcut to open search (Press '/' or 'Ctrl+K')
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault();
            sfx.open();
            setIsSearchOpen(true);
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            sfx.open();
            setIsSearchOpen(true);
          } else if (e.key === 'Escape' && isSearchOpen) {
            setIsSearchOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isSearchOpen]);

      // Initialize YouTube API safely (No empty videoId to prevent Error 153)
      useEffect(() => {
        window.onYouTubeIframeAPIReady = () => {
          initYTPlayer();
        };

        if (window.YT && window.YT.Player) {
          initYTPlayer();
        } else {
          const tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          const firstScriptTag = document.getElementsByTagName('script')[0];
          firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, []);

      function initYTPlayer() {
        if (playerRef.current) return;
        try {
          const config = {
            height: '100%',
            width: '100%',
            playerVars: {
              autoplay: 0,
              controls: 1, // Full native YouTube controls (Settings Gear & CC Subtitles)
              fs: 1,
              rel: 0,
              playsinline: 1,
              enablejsapi: 1,
              iv_load_policy: 3
            },
            events: {
              onReady: onPlayerReady,
              onStateChange: onPlayerStateChange,
              onError: onPlayerError
            }
          };

          if (currentTrackRef.current && currentTrackRef.current.videoId) {
            config.videoId = currentTrackRef.current.videoId;
          }

          playerRef.current = new window.YT.Player('youtube-player-embed', config);
        } catch (e) {
          console.error('YT init error:', e);
        }
      }

      function onPlayerReady(event) {
        isPlayerReady.current = true;
        event.target.setVolume(volume);
        if (currentTrackRef.current && currentTrackRef.current.videoId) {
          event.target.cueVideoById(currentTrackRef.current.videoId);
          setPlayerStatus('paused');
        }
      }

      function onPlayerStateChange(event) {
        const state = event.data;
        if (state === window.YT.PlayerState.PLAYING) {
          setIsPlaying(true);
          setPlayerStatus('playing');
          
          if (playerRef.current && playerRef.current.getVideoData) {
            const data = playerRef.current.getVideoData();
            if (data && data.title && currentTrackRef.current && (!currentTrackRef.current.title || currentTrackRef.current.title.startsWith('YouTube Video'))) {
              setCurrentTrack(prev => prev ? { ...prev, title: data.title } : null);
            }
          }
        } else if (state === window.YT.PlayerState.PAUSED) {
          setIsPlaying(false);
          setPlayerStatus('paused');
        } else if (state === window.YT.PlayerState.ENDED) {
          handleTrackEnded();
        } else if (state === window.YT.PlayerState.CUED) {
          setPlayerStatus(currentTrackRef.current ? 'paused' : 'empty');
          setIsPlaying(false);
        }
      }

      function onPlayerError(event) {
        if (event.data !== 153 && currentTrackRef.current) {
          showToast(`Video unavailable (Code ${event.data}) — Skipping to next`);
          setTimeout(() => {
            handleNextTrack();
          }, 1500);
        }
      }

      // Progress bar ticker
      useEffect(() => {
        if (isPlaying) {
          timerRef.current = setInterval(() => {
            if (playerRef.current && isPlayerReady.current && playerRef.current.getCurrentTime) {
              const cur = playerRef.current.getCurrentTime() || 0;
              const dur = playerRef.current.getDuration() || 0;
              setCurrentTime(cur);
              setDuration(dur);
            }
          }, 300);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [isPlaying]);

      // Auto Advance on song end: Append played track to History in chronological order
      function handleTrackEnded() {
        const currentMode = loopModeRef.current;
        const cur = currentTrackRef.current;
        const curQueue = queueRef.current;
        const curHistory = historyRef.current;

        if (currentMode === 'one' && cur && playerRef.current) {
          playerRef.current.seekTo(0);
          playerRef.current.playVideo();
          return;
        }

        if (curQueue.length > 0) {
          const next = curQueue[0];
          const remQueue = curQueue.slice(1);
          if (cur) {
            setHistory(prev => [...prev, cur]);
          }
          setCurrentTrack(next);
          setQueue(remQueue);
          playTrackInPlayer(next.videoId);
        } else if (currentMode === 'all' && curHistory.length > 0) {
          const allTracks = [...curHistory, ...(cur ? [cur] : [])];
          if (allTracks.length > 0) {
            const next = allTracks[0];
            setCurrentTrack(next);
            setQueue(allTracks.slice(1));
            setHistory([]);
            playTrackInPlayer(next.videoId);
          }
        } else {
          if (cur) {
            setHistory(prev => [...prev, cur]);
          }
          setCurrentTrack(null);
          setIsPlaying(false);
          setPlayerStatus('empty');
          setCurrentTime(0);
          setDuration(0);
        }
      }

      function playTrackInPlayer(videoId) {
        if (playerRef.current && isPlayerReady.current) {
          playerRef.current.loadVideoById(videoId);
          playerRef.current.playVideo();
          setIsPlaying(true);
          setPlayerStatus('playing');
        }
      }

      // --- TRANSPORT ACTIONS ---
      const handlePlayPause = () => {
        sfx.click();
        if (!currentTrack) {
          if (queue.length > 0) {
            handleNextTrack();
          } else {
            showToast('Please add a track to the queue first');
          }
          return;
        }

        if (playerRef.current && isPlayerReady.current) {
          if (isPlaying) {
            playerRef.current.pauseVideo();
            setIsPlaying(false);
            setPlayerStatus('paused');
          } else {
            playerRef.current.playVideo();
            setIsPlaying(true);
            setPlayerStatus('playing');
          }
        }
      };

      const handleNextTrack = () => {
        sfx.click();
        if (queue.length === 0) {
          showToast('No more tracks in queue');
          return;
        }
        const next = queue[0];
        const remQueue = queue.slice(1);
        if (currentTrack) {
          setHistory(prev => [...prev, currentTrack]);
        }
        setCurrentTrack(next);
        setQueue(remQueue);
        playTrackInPlayer(next.videoId);
        showToast(`Now Playing: ${next.title || next.videoId}`);
      };

      const handlePrevTrack = () => {
        sfx.click();
        if (currentTime > 3 && playerRef.current && isPlayerReady.current) {
          playerRef.current.seekTo(0);
          return;
        }

        if (history.length > 0) {
          const lastIdx = history.length - 1;
          const prev = history[lastIdx];
          const remHistory = history.slice(0, lastIdx);
          if (currentTrack) {
            setQueue(q => [currentTrack, ...q]);
          }
          setCurrentTrack(prev);
          setHistory(remHistory);
          playTrackInPlayer(prev.videoId);
          showToast(`Previous: ${prev.title || prev.videoId}`);
        } else if (currentTrack && playerRef.current) {
          playerRef.current.seekTo(0);
        } else {
          showToast('No previous playback history');
        }
      };

      const handleSeek = (e) => {
        if (!duration || !playerRef.current || !isPlayerReady.current) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickPos = (e.clientX - rect.left) / rect.width;
        const targetSec = clickPos * duration;
        playerRef.current.seekTo(targetSec, true);
        setCurrentTime(targetSec);
        sfx.switch();
      };

      const handleVolumeChange = (newVol) => {
        const val = Math.max(0, Math.min(100, Number(newVol)));
        setVolume(val);
        if (playerRef.current && isPlayerReady.current) {
          playerRef.current.setVolume(val);
          if (val > 0 && isMuted) {
            playerRef.current.unMute();
            setIsMuted(false);
          }
        }
      };

      const handleToggleMute = () => {
        sfx.click();
        if (playerRef.current && isPlayerReady.current) {
          if (isMuted) {
            playerRef.current.unMute();
            setIsMuted(false);
          } else {
            playerRef.current.mute();
            setIsMuted(true);
          }
        }
      };

      const handleToggleLoop = () => {
        sfx.click();
        const nextMode = loopMode === 'none' ? 'one' : loopMode === 'one' ? 'all' : 'none';
        setLoopMode(nextMode);
        showToast(nextMode === 'one' ? 'Repeat One Track' : nextMode === 'all' ? 'Repeat All Queue' : 'Repeat Off');
      };

      const handleShuffleQueue = () => {
        sfx.coin();
        if (queue.length <= 1) {
          showToast('Need at least 2 tracks in queue to shuffle');
          return;
        }
        const shuffled = [...queue].sort(() => Math.random() - 0.5);
        setQueue(shuffled);
        showToast('Queue order shuffled');
      };

      const handleToggleCC = () => {
        sfx.click();
        if (playerRef.current && isPlayerReady.current) {
          try {
            if (!ccEnabled) {
              if (playerRef.current.loadModule) {
                playerRef.current.loadModule('captions');
              }
              setCcEnabled(true);
              showToast('Subtitles Enabled (CC)');
            } else {
              if (playerRef.current.unloadModule) {
                playerRef.current.unloadModule('captions');
              }
              setCcEnabled(false);
              showToast('Subtitles Disabled');
            }
          } catch (e) {
            setCcEnabled(!ccEnabled);
          }
        } else {
          setCcEnabled(!ccEnabled);
        }
      };

      // --- QUEUE MUTATION ACTIONS ---
      const addToQueue = async (urlOrId) => {
        const videoId = extractVideoId(urlOrId);
        if (!videoId) {
          showToast('Invalid YouTube URL or Video ID');
          return false;
        }

        sfx.coin();
        showToast('Fetching track title...');
        const title = await fetchVideoTitle(videoId);

        const newTrack = {
          id: 'trk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          videoId: videoId,
          title: title || `YouTube Video [${videoId}]`,
          addedAt: Date.now()
        };

        setQueue(prev => [...prev, newTrack]);
        showToast(`Added to queue: ${newTrack.title}`);
        return true;
      };

      const addDirectTrack = (videoId, title) => {
        sfx.coin();
        const newTrack = {
          id: 'trk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          videoId: videoId,
          title: title || `YouTube Video [${videoId}]`,
          addedAt: Date.now()
        };
        setQueue(prev => [...prev, newTrack]);
        showToast(`Added: ${newTrack.title}`);
      };

      const playDirectTrack = (videoId, title) => {
        sfx.coin();
        const newTrack = {
          id: 'trk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          videoId: videoId,
          title: title || `YouTube Video [${videoId}]`,
          addedAt: Date.now()
        };
        if (currentTrack) {
          setHistory(prev => [...prev, currentTrack]);
        }
        setCurrentTrack(newTrack);
        playTrackInPlayer(videoId);
        showToast(`Playing: ${newTrack.title}`);
      };

      // Moving track from History back to Queue removes it from History (as requested)
      const handleRequeueFromHistory = (track, historyIndex) => {
        sfx.coin();
        const newTrack = {
          id: 'trk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          videoId: track.videoId,
          title: track.title,
          addedAt: Date.now()
        };
        setQueue(prev => [...prev, newTrack]);
        setHistory(prev => prev.filter((_, idx) => idx !== historyIndex));
        showToast(`Moved "${newTrack.title || newTrack.videoId}" to queue`);
      };

      const playNowFromQueue = (index) => {
        sfx.click();
        if (index < 0 || index >= queue.length) return;
        const selected = queue[index];
        const updatedQueue = queue.filter((_, idx) => idx !== index);
        
        if (currentTrack) {
          setHistory(prev => [...prev, currentTrack]);
        }
        setCurrentTrack(selected);
        setQueue(updatedQueue);
        playTrackInPlayer(selected.videoId);
        showToast(`Now Playing: ${selected.title}`);
      };

      const moveQueueItem = (index, direction) => {
        sfx.switch();
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= queue.length) return;
        
        const newQ = [...queue];
        const temp = newQ[index];
        newQ[index] = newQ[targetIndex];
        newQ[targetIndex] = temp;
        setQueue(newQ);
      };

      const removeQueueItem = (index) => {
        sfx.delete();
        setQueue(prev => prev.filter((_, idx) => idx !== index));
        showToast('Removed from queue');
      };

      const clearAllQueue = () => {
        sfx.delete();
        if (queue.length === 0) return;
        setQueue([]);
        showToast('Queue cleared');
      };

      const clearHistory = () => {
        sfx.delete();
        setHistory([]);
        showToast('History cleared');
      };

      return (
        <div className="app-wrapper">
          
          {/* Header Navigation Bar */}
          <header className="pixel-frame m-3 mb-0 p-3 flex flex-wrap items-center justify-between gap-3 bg-[#1D1728]/90">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-[#F57D7C] border-2 border-[#FFC061] flex items-center justify-center text-[#131021] text-2xl font-bold shadow-[2px_2px_0px_#000]">
                ♫
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-['Press_Start_2P'] text-sm sm:text-base text-[#F57D7C] tracking-wider">
                    JAPANESE MUSIC STATION
                  </h1>
                  <span className="text-xs bg-[#5B3256] px-1.5 py-0.5 border border-[#3D2F4C] text-[#FFC061] font-['Silkscreen']">
                    PIXEL × CITY POP
                  </span>
                </div>
                <p className="text-xs text-[#E08573] font-['Silkscreen'] tracking-wide">
                  City Pop Jukebox — 80s Dusk Alleyway DJ Booth
                </p>
              </div>
            </div>

            {/* Utility Toggles */}
            <div className="flex items-center gap-2">
              <button 
                onClick={() => {
                  sfx.enabled = !sfx.enabled;
                  showToast(sfx.enabled ? '8-Bit SFX Enabled' : '8-Bit SFX Muted');
                }}
                className={`btn-header ${sfx.enabled ? 'btn-clicked' : 'btn-unclicked'}`}
                title="Toggle 8-Bit Audio SFX"
              >
                {sfx.enabled ? 'SFX ON' : 'SFX OFF'}
              </button>
            </div>
          </header>

          {/* Toast Notification Banner */}
          {toastMsg && (
            <div className="fixed top-20 right-6 z-50 pixel-frame border-[#FFC061] bg-[#131021] text-[#FFC061] px-4 py-2 text-base font-['VT323'] shadow-[4px_4px_0px_#000] pulse-pixel">
              {toastMsg}
            </div>
          )}

          {/* Main 2-Column Responsive Workspace (Strict 65% : 35% on Desktop) */}
          <main className="main-workspace">
            
            {/* LEFT PANEL (65% Width) */}
            <div className="panel-left-container flex flex-col gap-3">
              <LeftPlayerPanel 
                currentTrack={currentTrack}
                isPlaying={isPlaying}
                playerStatus={playerStatus}
                volume={volume}
                isMuted={isMuted}
                currentTime={currentTime}
                duration={duration}
                loopMode={loopMode}
                playbackRate={playbackRate}
                ccEnabled={ccEnabled}
                queueLength={queue.length}
                historyLength={history.length}
                onPlayPause={handlePlayPause}
                onNext={handleNextTrack}
                onPrev={handlePrevTrack}
                onSeek={handleSeek}
                onVolumeChange={handleVolumeChange}
                onToggleMute={handleToggleMute}
                onToggleLoop={handleToggleLoop}
                onToggleCC={handleToggleCC}
                onAddTrack={addToQueue}
                onClearQueue={clearAllQueue}
                onShuffleQueue={handleShuffleQueue}
                onOpenSearch={() => { sfx.open(); setIsSearchOpen(true); }}
                onSetPlaybackRate={(rate) => {
                  setPlaybackRate(rate);
                  if (playerRef.current && isPlayerReady.current) {
                    playerRef.current.setPlaybackRate(rate);
                  }
                  showToast(`Playback Speed: ${rate}x`);
                }}
              />
            </div>

            {/* RIGHT PANEL (35% Width, Stretches 100% Height) */}
            <div className="panel-right-container flex flex-col gap-3">
              <RightQueuePanel 
                queue={queue}
                history={history}
                currentTrack={currentTrack}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                onPlayNow={playNowFromQueue}
                onMove={moveQueueItem}
                onRemove={removeQueueItem}
                onClearAll={clearAllQueue}
                onClearHistory={clearHistory}
                onRequeue={handleRequeueFromHistory}
              />
            </div>
          </main>

          {/* Footer Status Bar */}
          <footer className="pixel-frame m-3 mt-0 p-2 text-xs text-gray-400 flex flex-wrap items-center justify-between gap-2 bg-[#1D1728]/90 font-['Silkscreen']">
            <div className="flex items-center gap-3">
              <span className="inline-block w-2.5 h-2.5 bg-[#F57D7C] border border-[#FFC061]"></span>
              <span>STATION STATUS: <strong className="text-[#FFC061]">{playerStatus.toUpperCase()}</strong></span>
              <span className="text-gray-600">|</span>
              <span>QUEUE: <strong className="text-white">{queue.length} TRACKS</strong></span>
            </div>
            <div className="text-[#E08573] flex items-center gap-2">
              <span>PIXEL ART × CITY POP DJ BOOTH</span>
              <span className="text-[#FFC061]">Late Night Drive Music</span>
            </div>
          </footer>

          {/* RETRO ARCADE SEARCH POP-UP MODAL */}
          {isSearchOpen && (
            <ArcadeSearchModal 
              onClose={() => setIsSearchOpen(false)}
              onAddTrack={addDirectTrack}
              onPlayTrack={playDirectTrack}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // --- LEFT PANEL COMPONENT ---
    function LeftPlayerPanel({
      currentTrack,
      isPlaying,
      playerStatus,
      volume,
      isMuted,
      currentTime,
      duration,
      loopMode,
      playbackRate,
      ccEnabled,
      queueLength,
      historyLength,
      onPlayPause,
      onNext,
      onPrev,
      onSeek,
      onVolumeChange,
      onToggleMute,
      onToggleLoop,
      onToggleCC,
      onAddTrack,
      onClearQueue,
      onShuffleQueue,
      onOpenSearch,
      onSetPlaybackRate
    }) {
      const [inputUrl, setInputUrl] = useState('');
      const [isAdding, setIsAdding] = useState(false);

      const handleAddSubmit = async (e) => {
        e.preventDefault();
        if (!inputUrl.trim()) return;
        setIsAdding(true);
        const ok = await onAddTrack(inputUrl.trim());
        if (ok) setInputUrl('');
        setIsAdding(false);
      };

      const progressPercent = duration > 0 ? Math.min(100, (currentTime / duration) * 100) : 0;

      return (
        <div className="flex flex-col gap-3">
          
          {/* 16:9 YouTube Screen + DJ Frame (Clean Display without blocking overlay badge) */}
          <div className="pixel-frame p-3 bg-[#1D1728]/90 flex flex-col">
            <div className="flex items-center justify-between mb-2 text-xs font-['Press_Start_2P'] text-[#FFC061]">
              <div className="flex items-center gap-2">
                <span className="inline-block w-2.5 h-2.5 bg-[#F57D7C] animate-pulse"></span>
                <span>DJ BOOTH SCREEN (16:9)</span>
              </div>
              <span className="text-[#E08573] font-['Silkscreen'] text-xs">
                {isPlaying ? '● ON AIR' : '■ STANDBY'}
              </span>
            </div>

            {/* Video Container (Strict 16:9 Aspect Ratio, Clear Unobstructed Screen) */}
            <div className="relative w-full pb-[56.25%] pixel-frame-inset bg-[#131021] overflow-hidden group">
              
              {/* Actual YouTube IFrame Mounting Element */}
              <div id="youtube-player-embed" className="absolute inset-0 w-full h-full"></div>

              {/* Minimalist Display Area Overlay ONLY when empty */}
              {playerStatus === 'empty' && (
                <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#131021]/95 z-20 p-6 text-center">
                  <div className="font-['Press_Start_2P'] text-sm sm:text-base text-[#F57D7C] tracking-widest mb-2 border-b-2 border-[#3D2F4C] pb-2">
                    JAPANESE MUSIC STATION
                  </div>
                  <p className="font-['VT323'] text-base sm:text-lg text-[#E08573] max-w-md">
                    Search YouTube or paste a URL below to start your queue
                  </p>
                </div>
              )}
            </div>

            {/* Pixel Equalizer / Visualizer Bar */}
            <div className="mt-2.5 pt-2 border-t-2 border-[#3D2F4C] flex items-center justify-between gap-3">
              <div className="flex items-end gap-1 h-6 w-36 px-1.5 bg-[#131021] border-2 border-[#3D2F4C]">
                {[40, 75, 90, 60, 100, 45, 80, 65, 95, 50, 85, 70, 90, 55, 80, 60].map((height, i) => (
                  <div 
                    key={i}
                    className="flex-1 bg-[#F57D7C] transition-all"
                    style={{
                      height: isPlaying ? `${(Math.sin((Date.now()/180) + i * 0.8) * 35 + height/2 + 25)}%` : '15%',
                      backgroundColor: i % 2 === 0 ? '#F57D7C' : '#FFC061'
                    }}
                  ></div>
                ))}
              </div>

              {/* Status Tags */}
              <div className="flex items-center gap-2 text-xs font-['Silkscreen']">
                <span className="px-2 py-0.5 bg-[#2A2238] border border-[#3D2F4C] text-gray-300">
                  RATE: {playbackRate}x
                </span>
                <span className="px-2 py-0.5 bg-[#2A2238] border border-[#3D2F4C] text-[#FFC061]">
                  VOL: {isMuted ? 'MUTED' : `${volume}%`}
                </span>
              </div>
            </div>
          </div>

          {/* NOW PLAYING INFO BAR */}
          <div className="pixel-frame p-3 bg-[#1D1728]/90 flex flex-col gap-2">
            <div className="flex items-center justify-between text-xs text-[#E08573] font-['Press_Start_2P']">
              <div className="flex items-center gap-2">
                <span className="text-[#F57D7C]">NOW PLAYING</span>
                {currentTrack && (
                  <span className="text-gray-400 font-['VT323'] text-sm font-normal">
                    [ID: {currentTrack.videoId}]
                  </span>
                )}
              </div>
              <div className="text-[#FFC061] font-['VT323'] text-base">
                {formatTime(currentTime)} / {formatTime(duration)}
              </div>
            </div>

            {/* Marquee Title Container */}
            <div className="pixel-frame-inset p-2 bg-[#131021] overflow-hidden whitespace-nowrap">
              {currentTrack ? (
                <div className="font-['VT323'] text-lg sm:text-xl text-[#FFC061] font-bold animate-marquee">
                  {currentTrack.title || `YouTube Video [${currentTrack.videoId}]`} ─── Retro City Pop Radio ───
                </div>
              ) : (
                <div className="font-['VT323'] text-base text-gray-500 italic">
                  No track currently playing (search for tracks or paste URL to start)
                </div>
              )}
            </div>

            {/* Interactive Pixel Progress Bar */}
            <div 
              onClick={onSeek}
              className="relative w-full h-4 bg-[#131021] border-2 border-[#3D2F4C] cursor-pointer shadow-[inset_2px_2px_0px_#000]"
              title="Click to seek position"
            >
              <div 
                className="h-full bg-[#F57D7C] border-r-2 border-[#FFC061] transition-all"
                style={{ width: `${progressPercent}%` }}
              ></div>

              {duration > 0 && (
                <div 
                  className="absolute top-[-4px] w-3 h-5 bg-[#FFC061] border-2 border-[#131021] shadow-[1px_1px_0px_#000]"
                  style={{ left: `calc(${progressPercent}% - 6px)` }}
                ></div>
              )}
            </div>
          </div>

          {/* URL INPUT & SEARCH BUTTON (Equal height & width) */}
          <div className="pixel-frame p-3 bg-[#1D1728]/90 flex flex-col gap-2">
            <div className="flex items-center justify-between text-xs font-['Press_Start_2P'] text-[#E08573]">
              <span>ADD TRACK</span>
              <span className="text-gray-400 font-['VT323'] text-sm">Supports youtube.com, youtu.be, shorts</span>
            </div>

            <form onSubmit={handleAddSubmit} className="flex flex-col sm:flex-row gap-2">
              <input 
                type="text"
                value={inputUrl}
                onChange={(e) => setInputUrl(e.target.value)}
                placeholder="Paste YouTube URL (or click Search)..."
                className="pixel-input flex-1 text-base sm:text-lg"
              />
              <button 
                type="submit"
                disabled={isAdding || !inputUrl.trim()}
                className="btn-unclicked btn-form-action shrink-0"
              >
                {isAdding ? 'ADDING...' : 'ADD URL'}
              </button>
              <button 
                type="button"
                onClick={onOpenSearch}
                className="btn-clicked btn-form-action shrink-0"
                title="Search YouTube Videos"
              >
                SEARCH
              </button>
            </form>
          </div>

          {/* TRANSPORT CONTROLS & AUDIO SETTINGS */}
          <div className="pixel-frame p-3 bg-[#1D1728]/90 flex flex-col gap-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              
              {/* Primary Transport Group: Prev, Play/Pause, Next */}
              <div className="flex items-center gap-2">
                <button 
                  onClick={onPrev}
                  className="btn-unclicked btn-transport-prev-next"
                  title="Previous Track / Restart"
                >
                  ⏮
                </button>

                <button 
                  onClick={onPlayPause}
                  className={`btn-transport-play ${isPlaying ? 'btn-clicked' : 'btn-unclicked'}`}
                  title={isPlaying ? 'Pause' : 'Play'}
                >
                  {isPlaying ? 'PAUSE' : 'PLAY'}
                </button>

                <button 
                  onClick={onNext}
                  disabled={queueLength === 0}
                  className="btn-unclicked btn-transport-prev-next"
                  title="Next Track"
                >
                  ⏭
                </button>
              </div>

              {/* Secondary Modes Group: Loop, Shuffle, CC */}
              <div className="flex items-center gap-2">
                <button 
                  onClick={onToggleLoop}
                  className={`btn-mode-group ${loopMode !== 'none' ? 'btn-clicked' : 'btn-unclicked'}`}
                  title={`Repeat Mode: ${loopMode}`}
                >
                  {loopMode === 'one' ? 'LOOP 1' : loopMode === 'all' ? 'LOOP ALL' : 'LOOP OFF'}
                </button>

                <button 
                  onClick={onShuffleQueue}
                  disabled={queueLength <= 1}
                  className="btn-unclicked btn-mode-group"
                  title="Shuffle Queue"
                >
                  SHUFFLE
                </button>

                <button 
                  onClick={onToggleCC}
                  className={`btn-mode-group ${ccEnabled ? 'btn-clicked' : 'btn-unclicked'}`}
                  title="Toggle Subtitles (CC)"
                >
                  {ccEnabled ? 'CC ON' : 'CC OFF'}
                </button>
              </div>

              {/* Speed Controller Group */}
              <div className="flex items-center gap-1">
                <span className="text-xs font-['Press_Start_2P'] text-[#E08573] mr-1">SPEED:</span>
                {[0.75, 1, 1.25, 1.5].map((rate) => (
                  <button
                    key={rate}
                    onClick={() => onSetPlaybackRate(rate)}
                    className={`btn-speed ${playbackRate === rate ? 'btn-clicked' : 'btn-unclicked'}`}
                  >
                    {rate}x
                  </button>
                ))}
              </div>
            </div>

            {/* Volume Control Slider & Clear Queue */}
            <div className="pt-2 border-t-2 border-[#3D2F4C] flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2 flex-1 max-w-sm">
                <button 
                  onClick={onToggleMute}
                  className="pixel-btn px-2.5 py-1 text-sm text-[#FFC061]"
                  title={isMuted ? 'Unmute' : 'Mute'}
                >
                  {isMuted || volume === 0 ? 'MUTED' : 'VOL'}
                </button>

                <div className="flex-1 flex items-center gap-2">
                  <span className="text-xs font-['Press_Start_2P'] text-gray-400">VOL</span>
                  <input 
                    type="range"
                    min="0"
                    max="100"
                    value={isMuted ? 0 : volume}
                    onChange={(e) => onVolumeChange(e.target.value)}
                    className="w-full h-3 bg-[#131021] accent-[#F57D7C] cursor-pointer border-2 border-[#3D2F4C]"
                  />
                  <span className="text-sm font-['VT323'] text-[#FFC061] w-8 text-right">
                    {isMuted ? '0' : volume}%
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={onClearQueue}
                  disabled={queueLength === 0}
                  className="btn-unclicked pixel-btn-danger text-sm"
                  style={{ height: '36px' }}
                  title="Clear all tracks in queue"
                >
                  CLEAR QUEUE ({queueLength})
                </button>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // --- RIGHT PANEL COMPONENT (100% Vertical Space Utilization & Clean Single-Line Rows) ---
    function RightQueuePanel({
      queue,
      history,
      currentTrack,
      activeTab,
      setActiveTab,
      onPlayNow,
      onMove,
      onRemove,
      onClearAll,
      onClearHistory,
      onRequeue
    }) {
      return (
        <div className="pixel-frame p-3 bg-[#1D1728]/90 flex flex-col h-full flex-1">
          
          {/* Panel Header & Navigation Tabs (Exact Equal 50/50 Width & Height) */}
          <div className="flex items-center gap-2 border-b-2 border-[#3D2F4C] pb-2 mb-2 shrink-0">
            <button 
              onClick={() => { sfx.switch(); setActiveTab('queue'); }}
              className={`btn-tab ${activeTab === 'queue' ? 'btn-clicked' : 'btn-unclicked'}`}
            >
              QUEUE ({queue.length})
            </button>
            
            <button 
              onClick={() => { sfx.switch(); setActiveTab('history'); }}
              className={`btn-tab ${activeTab === 'history' ? 'btn-clicked' : 'btn-unclicked'}`}
            >
              HISTORY ({history.length})
            </button>
          </div>

          {/* TAB 1: QUEUE LIST (Expands 100% to fill panel height) */}
          {activeTab === 'queue' && (
            <div className="flex flex-col flex-1 min-h-0 justify-between">
              
              {/* Queue Items Container (Fills 100% available space with custom scrollbar) */}
              <div className="flex-1 min-h-0 overflow-y-auto pr-1 flex flex-col gap-2">
                {queue.length === 0 ? (
                  <div className="pixel-frame-inset p-6 text-center my-auto flex flex-col items-center justify-center bg-[#131021]/70 min-h-[160px]">
                    <div className="font-['Press_Start_2P'] text-xs text-[#FFC061] tracking-wider mb-2">
                      QUEUE IS EMPTY
                    </div>
                    <p className="font-['VT323'] text-lg text-[#E08573]">
                      Search YouTube or paste a link on the left to add tracks
                    </p>
                  </div>
                ) : (
                  queue.map((track, index) => (
                    <div 
                      key={track.id}
                      className="pixel-frame p-2 bg-[#2A2238]/90 hover:bg-[#5B3256]/50 transition-colors flex items-center justify-between gap-2 group min-h-[46px]"
                    >
                      {/* Left: Index + Play Button + Clean Single-Line Title */}
                      <div className="flex items-center gap-2 overflow-hidden flex-1 min-w-0">
                        <span className="w-8 text-center font-['Press_Start_2P'] text-xs text-[#E08573] shrink-0">
                          #{index + 1}
                        </span>

                        <button 
                          onClick={() => onPlayNow(index)}
                          className="btn-unclicked text-xs hover:bg-white font-bold shrink-0 h-[28px] px-2"
                          title="Play this track now"
                        >
                          PLAY
                        </button>

                        <div className="overflow-hidden min-w-0 flex-1">
                          <span className="font-['VT323'] text-lg text-white font-medium truncate block group-hover:text-[#FFC061]" title={track.title}>
                            {track.title || `YouTube Video [${track.videoId}]`}
                          </span>
                        </div>
                      </div>

                      {/* Right: Controls [▲] [▼] [✕] */}
                      <div className="flex items-center gap-1 shrink-0">
                        <button 
                          onClick={() => onMove(index, -1)}
                          disabled={index === 0}
                          className="btn-unclicked text-xs h-[28px] px-2"
                          title="Move Up"
                        >
                          ▲
                        </button>

                        <button

                          className="btn-unclicked text-xs h-[28px] px-2"

              <div className="flex-1 min-h-0 overflow-y-auto max-h-[100%] pr-1 flex flex-col gap-2">

                    <div className="font-['Press_Start_2P'] text-xs text-[#FFC061] tracking-wider mb-2">

                    </div>
                    <p className="font-['VT323'] text-lg text-[#E08573]">

                  history.map((track, index) => (
                    <div 
                      key={track.id + '_' + index}
                      className="pixel-frame p-2 bg-[#2A2238]/90 hover:bg-[#5B3256]/50 transition-colors flex items-center justify-between gap-2 group min-h-[46px]"
                    >
                      <div className="flex items-center gap-2 overflow-hidden flex-1 min-w-0">

                        <div className="overflow-hidden min-w-0 flex-1">
                          <span className="font-['VT323'] text-lg text-white font-medium truncate block group-hover:text-[#FFC061]" title={track.title}>
                            {track.title || track.videoId}

                      </div>

                      {/* Re-add button: Moves track from History to Queue */}
                      <button 
                        onClick={() => onRequeue(track, index)}

              {/* Bottom Actions for History */}
              <div className="pt-3 mt-2 border-t-2 border-[#3D2F4C] flex items-center justify-between gap-2 shrink-0">

    // --- RETRO ARCADE SEARCH POP-UP MODAL ---
    function ArcadeSearchModal({ onClose, onAddTrack, onPlayTrack, showToast }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [results, setResults] = useState([]);
      const [addedIds, setAddedIds] = useState({});
      const inputRef = useRef(null);

      useEffect(() => {
        if (inputRef.current) {
          inputRef.current.focus();
        }
      }, []);

      const performSearch = async (queryText) => {
        const q = (queryText || searchQuery).trim();
        if (!q) return;

        sfx.click();
        setIsSearching(true);
        setResults([]);

        // Tier 0: Direct YouTube URL or Video ID
        const directId = extractVideoId(q);
        if (directId) {
          const title = await fetchVideoTitle(directId);
          setResults([{
            videoId: directId,
            title: title,
            author: 'Direct YouTube Link',
            lengthText: '--:--'
          }]);
          setIsSearching(false);
          return;
        }

        let searchSuccess = false;

        // Tier 1: Real YouTube Official Search via allorigins.win and corsproxy.io
        const corsProxies = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + encodeURIComponent(q))}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent('https://www.youtube.com/results?search_query=' + encodeURIComponent(q))}`
        ];

        for (const proxyUrl of corsProxies) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4500);
            const res = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (res.ok) {
              const htmlText = await res.text();
              const jsonMatch = htmlText.match(/var ytInitialData\s*=\s*({.*?});<\/script>/s) || htmlText.match(/ytInitialData\s*=\s*({.*?});/s);
              if (jsonMatch && jsonMatch[1]) {
                const parsedData = JSON.parse(jsonMatch[1]);
                const sectionList = parsedData?.contents?.twoColumnSearchResultsRenderer?.primaryContents?.sectionListRenderer?.contents;
                if (Array.isArray(sectionList)) {
                  const extracted = [];
                  for (const section of sectionList) {
                    const itemContents = section?.itemSectionRenderer?.contents;
                    if (Array.isArray(itemContents)) {
                      for (const item of itemContents) {
                        const vr = item?.videoRenderer;
                        if (vr && vr.videoId) {
                          const titleText = vr.title?.runs?.[0]?.text || vr.title?.accessibility?.accessibilityData?.label || 'YouTube Track';
                          const authorText = vr.ownerText?.runs?.[0]?.text || vr.shortBylineText?.runs?.[0]?.text || 'YouTube Artist';
                          const durationText = vr.lengthText?.simpleText || vr.lengthText?.runs?.[0]?.text || '';
                          extracted.push({
                            videoId: vr.videoId,
                            title: titleText,
                            author: authorText,
                            lengthText: durationText
                          });
                        }
                      }
                    }
                  }
                  if (extracted.length > 0) {
                    setResults(extracted.slice(0, 15));
                    searchSuccess = true;
                    break;
                  }
                }
              }
            }
          } catch (e) {}
        }

        // Tier 2: Piped API Endpoints with Native CORS
        if (!searchSuccess) {
          const pipedEndpoints = [
            `https://api.piped.private.coffee/search?q=${encodeURIComponent(q)}&filter=videos`,
            `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`
          ];

          for (const ep of pipedEndpoints) {
            try {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 4000);
              const res = await fetch(ep, { signal: controller.signal });
              clearTimeout(timeoutId);

              if (res.ok) {
                const data = await res.json();
                const items = data.items || data;
                if (Array.isArray(items) && items.length > 0) {
                  const clean = items
                    .filter(i => (i.url && i.url.includes('watch?v=')) || i.id || i.videoId)
                    .map(i => {
                      const id = i.id || i.videoId || (i.url ? i.url.split('watch?v=')[1]?.split('&')[0] : '');
                      return {
                        videoId: id,
                        title: i.title || 'Untitled Track',
                        author: i.uploaderName || i.uploader || 'Artist',
                        lengthText: i.duration ? formatTime(i.duration) : ''
                      };
                    })
                    .filter(i => i.videoId);
                  
                  if (clean.length > 0) {
                    setResults(clean.slice(0, 15));
                    searchSuccess = true;
                    break;
                  }
                }
              }
            } catch (e) {}
          }
        }

        if (!searchSuccess) {
          showToast('Search service busy. You can paste direct YouTube URLs.');
        }

        setIsSearching(false);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        performSearch(searchQuery);
      };

      const handleAddClick = (item) => {
        onAddTrack(item.videoId, item.title);
        setAddedIds(prev => ({ ...prev, [item.videoId]: true }));
        setTimeout(() => {
          setAddedIds(prev => ({ ...prev, [item.videoId]: false }));
        }, 2500);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-[#131021]/85 backdrop-blur-sm">
          <div className="pixel-frame-arcade w-full max-w-3xl max-h-[85vh] flex flex-col p-4 bg-[#1D1728]/95 shadow-[8px_8px_0px_#000] border-4 border-[#F57D7C] relative">
            
            {/* Arcade Modal Header */}
            <div className="flex items-center justify-between border-b-2 border-[#3D2F4C] pb-3 mb-3">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 bg-[#FFC061] border border-[#F57D7C] animate-pulse"></span>
                <span className="font-['Press_Start_2P'] text-sm sm:text-base text-[#FFC061] tracking-wider">
                  ARCADE SEARCH // YOUTUBE
                </span>
              </div>
              
              <button 
                onClick={() => { sfx.click(); onClose(); }}
                className="btn-unclicked pixel-btn-danger text-sm font-bold"
                style={{ height: '36px', padding: '0 12px' }}
                title="Close Window (Escape)"
              >
                ✕ ESC
              </button>
            </div>

            {/* Arcade Search Bar Form */}
            <form onSubmit={handleFormSubmit} className="flex gap-2 mb-3">
              <input 
                ref={inputRef}
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Type artist, song title or paste YouTube URL..."
                className="pixel-input flex-1 text-lg sm:text-xl border-2 border-[#F57D7C]"
              />
              <button 
                type="submit"
                disabled={isSearching || !searchQuery.trim()}
                className="btn-clicked text-lg sm:text-xl font-bold shrink-0"
                style={{ height: '48px', padding: '0 20px' }}
              >
                {isSearching ? 'SEARCHING...' : 'SEARCH'}
              </button>
            </form>

            {/* Search Results Display Area */}
            <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2.5 min-h-[280px] max-h-[460px]">
              {isSearching ? (
                <div className="pixel-frame-inset p-8 text-center my-auto flex flex-col items-center justify-center bg-[#131021]/80">
                  <div className="font-['Press_Start_2P'] text-xs text-[#F57D7C] animate-pulse mb-2">
                    QUERYING YOUTUBE DATABASE...
                  </div>
                  <div className="w-32 h-2 bg-[#131021] border border-[#3D2F4C] overflow-hidden">
                    <div className="h-full bg-[#FFC061] animate-marquee w-12"></div>
                  </div>
                </div>
              ) : results.length === 0 ? (
                <div className="pixel-frame-inset p-8 text-center my-auto flex flex-col items-center justify-center bg-[#131021]/70">
                  <div className="font-['Press_Start_2P'] text-xs text-[#FFC061] tracking-wider mb-2">
                    READY TO SEARCH
                  </div>
                  <p className="font-['VT323'] text-lg text-[#E08573]">
                    Enter a song or artist name above to discover tracks and add them to your queue in 1 click
                  </p>
                </div>
              ) : (
                results.map((item) => (
                  <div 
                    key={item.videoId}
                    className="pixel-frame p-2.5 bg-[#2A2238]/90 hover:bg-[#5B3256]/50 transition-colors flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 group"
                  >
                    {/* Left: Thumbnail & Details */}
                    <div className="flex items-center gap-3 overflow-hidden flex-1 min-w-0 w-full sm:w-auto">
                      <div className="relative w-24 sm:w-28 pb-[14%] sm:pb-[16%] shrink-0 bg-[#131021] border-2 border-[#3D2F4C] overflow-hidden">
                        <img 
                          src={`https://i.ytimg.com/vi/${item.videoId}/mqdefault.jpg`}
                          alt={item.title}
                          className="absolute inset-0 w-full h-full object-cover"
                          loading="lazy"
                          onError={(e) => {
                            e.target.style.display = 'none';
                          }}
                        />
                      </div>

                      <div className="flex flex-col overflow-hidden min-w-0 flex-1">
                        <span className="font-['VT323'] text-lg text-white font-bold truncate group-hover:text-[#FFC061]" title={item.title}>
                          {item.title}
                        </span>
                        <div className="flex items-center gap-2 text-xs font-['Silkscreen'] text-gray-400">
                          <span className="truncate">{item.author}</span>
                          {item.lengthText && (
                            <span className="px-1.5 py-0.2 bg-[#131021] border border-[#3D2F4C] text-[#FFC061]">
                              {item.lengthText}
                            </span>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Right: Actions */}
                    <div className="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                      <button 
                        onClick={() => {
                          onPlayTrack(item.videoId, item.title);
                          onClose();
                        }}
                        className="btn-unclicked text-sm font-bold"
                        style={{ height: '34px', padding: '0 12px' }}
                        title="Play immediately"
                      >
                        PLAY
                      </button>

                      <button 
                        onClick={() => handleAddClick(item)}
                        className={`${addedIds[item.videoId] ? 'btn-clicked' : 'btn-unclicked'} text-sm font-bold`}
                        style={{ height: '34px', padding: '0 14px' }}
                        title="Add to queue"
                      >
                        {addedIds[item.videoId] ? 'ADDED!' : '+ ADD QUEUE'}
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* Arcade Modal Footer */}
            <div className="pt-3 mt-3 border-t-2 border-[#3D2F4C] flex items-center justify-between text-xs text-gray-400 font-['Silkscreen']">
              <span>PRESS [ESC] TO CLOSE</span>
              <span>1-CLICK ADD TO QUEUE</span>
            </div>

          </div>
        </div>
      );
    }

    // Safely Mount React App
    function initApp() {
      const container = document.getElementById('root');
      if (container && window.ReactDOM) {
        ReactDOM.createRoot(container).render(<App />);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
